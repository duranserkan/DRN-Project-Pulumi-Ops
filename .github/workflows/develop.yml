name: develop

on:
  push:
    branches: [develop]

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
