name: master

on:
  push:
    branches: [master]
  schedule:
    - cron: '29 13 * * 0' # Sunday at 13:29 UTC, on the default branch.

concurrency:
  group: master-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
